name: Bug report
description: Report a reproducible problem with Codex Usage HUD
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Do not include access tokens, auth files, private logs, or other secrets.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v2.0.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and expected behavior
      description: Include the smallest reproducible steps and what you expected.
    validations:
      required: true
