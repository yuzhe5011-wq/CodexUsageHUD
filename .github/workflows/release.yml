name: Build release packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (for example v2.0.1)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build Windows ZIP
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\build-windows-release.ps1 -Version $env:RELEASE_VERSION
      - name: Create Windows checksum
        shell: powershell
        run: |
          $archive = Get-ChildItem -LiteralPath .\build -Filter 'CodexUsageHUD-Windows-*.zip' | Select-Object -First 1
          $hash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$($archive.FullName).sha256" -Value "$hash  $($archive.Name)" -Encoding ASCII
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: CodexUsageHUD-Windows-${{ env.RELEASE_VERSION }}
          path: |
            build/CodexUsageHUD-Windows-*.zip
            build/CodexUsageHUD-Windows-*.sha256

  macos:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build macOS app
        run: bash ./macos/build-macos.sh
      - name: Package macOS app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            ./macos/build/CodexUsageHUD.app \
            "$RUNNER_TEMP/CodexUsageHUD-macOS-${RELEASE_VERSION}.zip"
          shasum -a 256 "$RUNNER_TEMP/CodexUsageHUD-macOS-${RELEASE_VERSION}.zip" \
            > "$RUNNER_TEMP/CodexUsageHUD-macOS-${RELEASE_VERSION}.zip.sha256"
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: CodexUsageHUD-macOS-${{ env.RELEASE_VERSION }}
          path: |
            ${{ runner.temp }}/CodexUsageHUD-macOS-*.zip
            ${{ runner.temp }}/CodexUsageHUD-macOS-*.zip.sha256

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_VERSION" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "CodexUsageHUD $RELEASE_VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes
